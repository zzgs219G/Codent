[versions]
# 2025-2026 稳定版基石
agp = "8.11.0"
kotlin = "2.1.0"
compileSdk = "35"
minSdk = "26"

junit = "4.13.2"
mockk = "1.13.9"
robolectric = "4.11.1"

# 核心库版本
composeBom = "2025.10.00"
lifecycle = "2.8.7"
navigation = "2.8.5"
coroutines = "1.9.0"
coil = "3.0.0-rc01"
# 两行合并回一行，用同一个版本
langchain4j = "1.0.0-beta1"

[libraries]
langchain4j-core   = { module = "dev.langchain4j:langchain4j-core",    version.ref = "langchain4j" }
langchain4j-openai = { module = "dev.langchain4j:langchain4j-open-ai", version.ref = "langchain4j" }

compose-markdown = { module = "com.github.jeziellago:compose-markdown", version = "0.5.8" }
# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.0.1" }

# Lifecycle & Navigation
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Compose BOM & UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
androidx-compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ✨ AI 时代核心 2：文件读写与补丁算法优化（告别低效手搓）
okio = { group = "com.squareup.okio", name = "okio", version = "3.9.0" }
javaDiffUtils = { group = "io.github.java-diff-utils", name = "java-diff-utils", version = "4.12" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.3" }

# 工具
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version = "2.0.16" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
mockk = { group = "io.mockk", name = "mockk", version = "1.13.9" }
robolectric = { group = "org.robolectric", name = "robolectric", version = "4.11.1" }

[bundles]
compose-ui-core = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-navigation-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-compose-icons-extended"
]

# ✨ 船新升级：把臃肿的 Ktor 联网大礼包，换成高内聚的 LangChain4j 大礼包！
langchain4j = [
    "langchain4j-core",
    "langchain4j-openai"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
